<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión — GadGet Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111827;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .icono { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { color: #9ca3af; font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
        .boton {
            margin-top: 2rem;
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: #fff;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .logo { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <img src="/logo.png" alt="GadGet Store" class="logo" onerror="this.style.display='none'">
    <div class="icono">📡</div>
    <h1>Sin conexión</h1>
    <p>Parece que no tienes internet en este momento. Conéctate y vuelve a intentarlo.</p>
    <button class="boton" onclick="window.location.reload()">Reintentar</button>
</body>
</html>
