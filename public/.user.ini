; Configuración local de PHP para desarrollo
; Este archivo sobreescribe php.ini para esta carpeta

; Tamaño máximo de cada archivo subido
upload_max_filesize = 10M

; Tamaño máximo del cuerpo completo del POST (debe ser mayor que upload_max_filesize)
post_max_size = 20M

; Tiempo máximo de ejecución en segundos
max_execution_time = 60
